# ============================================================
# baby-ai 服务器部署编排
#
# 使用：
#   cd /opt/apps/baby-ai
#   docker compose -f docker-compose.server.yml up -d --build
#
# 前提：
#   1. 共享 Ollama 已在 ai-net 网络里运行（/opt/apps/infra）
#   2. 仓库根目录有 .env（不提交 git）
#   3. python-server/{data,uploads,logs} 已存在且属主 UID 1000
# ============================================================

name: baby-ai

services:
  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      # 只绑本机:公网统一走 Caddy(443),避免绕过 HTTPS / 代理头 / 边缘规则
      - "127.0.0.1:8081:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./python-server
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
      - RERANKER_URL=http://reranker:8011/rerank
      - MAX_FILE_SIZE_MB=10
    volumes:
      - ./python-server/data:/app/data
      - ./python-server/uploads:/app/uploads
      - ./python-server/logs:/app/logs
    depends_on:
      chroma:
        condition: service_started
    networks:
      - default
      - ai-net
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8010/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  chroma:
    image: chromadb/chroma:latest
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    mem_limit: 512m
    networks:
      - default

  reranker:
    build:
      context: ./reranker
      dockerfile: Dockerfile
    volumes:
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_ENDPOINT=${HF_ENDPOINT:-https://huggingface.co}
      - OMP_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    restart: unless-stopped
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8011/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default

  # ------------------------------------------------------------
  # 一次性灌库服务（不随 up 启动）
  #
  #   # 预览
  #   docker compose -f docker-compose.server.yml --profile ingest run --rm ingest
  #
  #   # 灌 rag_medical
  #   docker compose -f docker-compose.server.yml --profile ingest run --rm ingest \
  #     python scripts/ingest_balanced.py --reset
  #
  #   # 灌 rag_samples
  #   docker compose -f docker-compose.server.yml --profile ingest run --rm ingest \
  #     python scripts/ingest_samples.py --reset
  # ------------------------------------------------------------
  ingest:
    profiles: ["ingest"]
    build:
      context: ./python-server
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./python-server/scripts:/app/scripts
      - ./server/data:/app/server-data:ro
    networks:
      - default
      - ai-net
    depends_on:
      chroma:
        condition: service_started
    mem_limit: 1g
    command: ["python", "scripts/ingest_balanced.py", "--dry-run"]

volumes:
  chroma_data:
  hf_cache:

networks:
  ai-net:
    external: true
